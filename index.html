<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine</title>
<meta name="description" content="every coin is a mine. launch a pump.fun coin and it becomes a mine: its creator fees fill a pool, browsers mine the coin's own SHA-256 chain, and every block pays its finder SOL on solana.">
<meta name="theme-color" content="#060402">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/icon-64.png">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Mine">
<meta property="og:description" content="every coin is a mine. your browser mines it. every block pays SOL.">
<meta property="og:url" content="https://minewrld.vercel.app/">
<meta property="og:image" content="https://minewrld.vercel.app/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mine">
<meta name="twitter:description" content="every coin is a mine. your browser mines it. every block pays SOL.">
<meta name="twitter:image" content="https://minewrld.vercel.app/assets/img/og.jpg">
<link rel="preload" href="/assets/fonts/VT323-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/PixelifySans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/mw.css?v=2">
<link rel="modulepreload" href="/assets/js/os.js?v=2">
<link rel="modulepreload" href="/assets/js/vendor/three.module.min.js">
<link rel="modulepreload" href="/assets/js/mintro.js?v=2">
<link rel="modulepreload" href="/assets/js/mine.js?v=2">
</head>
<body class="booting">

<!-- 1. the mine -->
<div id="intro" aria-label="Mine: the mine at night">
  <canvas id="room" aria-hidden="true"></canvas>
  <button class="isound wait" id="isound" type="button" aria-label="music on or off" title="music"><i></i><i></i><i></i><i></i></button>
  <div class="ihint" id="ihint">type on the terminal, or press enter</div>
  <button class="iskip" id="iskip" type="button">skip intro ›</button>
  <div class="itouch" id="itouch"><button type="button" data-go="">enter ↵</button><button type="button" data-go="mine">mine</button><button type="button" data-go="launch">launch</button><button type="button" data-go="chain">chain</button></div>
  <pre class="ifall" id="ifall" hidden></pre>
</div>

<!-- 2. the desktop -->
<div id="desk" hidden>
  <canvas id="wall" aria-hidden="true"></canvas>
  <div id="ticker" aria-label="live: the newest blocks and the fullest pools"><span class="tk-live"><i></i>live</span><div class="tk-vp"><div class="tk-strip"></div></div><button type="button" class="tk-sum" title="stats.exe"></button></div>
  <div id="icons" aria-label="desktop"></div>
  <div id="wins"></div>
  <div id="pets" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <nav id="bar">
    <button type="button" id="start" aria-label="start"><img src="/assets/img/miner.png" alt=""><span>mine</span></button>
    <div id="tasks"></div>
    <div id="tray">
      <button type="button" id="rigt" class="tray-r" title="rig.exe" hidden></button>
      <button type="button" id="engine" class="tray-e off" title="engine"><i></i><span>engine</span></button>
      <button type="button" id="wchip"><i class="dot"></i>connect</button>
      <button type="button" id="sndb" title="sound">♪</button>
      <span id="clock">--:--</span>
    </div>
  </nav>
  <div id="startm" hidden></div>
</div>
<div id="zoomr" aria-hidden="true"></div>
<div id="crt" aria-hidden="true"></div>

<script type="module" src="/assets/js/os.js?v=2"></script>
</body>
</html>
